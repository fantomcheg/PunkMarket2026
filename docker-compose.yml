version: '3.8'

services:
  # PostgreSQL для SQL инъекций
  postgres:
    image: postgres:16-alpine
    container_name: omnimarket_postgres
    environment:
      POSTGRES_DB: omnimarket
      POSTGRES_USER: omni_user
      POSTGRES_PASSWORD: omni_password_vulnerable_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  # MongoDB для NoSQL инъекций
  mongo:
    image: mongo:7-jammy
    container_name: omnimarket_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: omni_admin
      MONGO_INITDB_ROOT_PASSWORD: omni_mongo_pass_vulnerable_456
      MONGO_INITDB_DATABASE: omnimarket
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro

volumes:
  postgres_data:
  mongo_data:
